# mkfs.fat, for the boot partition in internal mode.
name = "dosfstools"
version = "4.2"

[source]
url = "https://github.com/dosfstools/dosfstools/releases/download/v4.2/dosfstools-4.2.tar.gz"
sha256 = "64926eebf90092dca21b14259a5301b7b98e7b1943e8a201c7d726084809b527"
strip = 1

[build]
script = """
cd "$BUILD"
[ -f Makefile ] || "$SRC/configure" --prefix=/usr --sbindir=/usr/bin --enable-compat-symlinks=no
make -j"$JOBS"
make install DESTDIR="$DEST"
"""
