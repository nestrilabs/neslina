# Only libuuid and libblkid, which xfsprogs needs. None of util-linux's
# programs: neslina has its own init, mount handling and partitioning.
name = "util-linux"
version = "2.42.4"

[source]
url = "https://www.kernel.org/pub/linux/utils/util-linux/v2.42/util-linux-2.42.4.tar.xz"
sha256 = "fbd62a100ab7bb8746ba0661255c3c48185b1e9021507c624da01fbc696330ec"
strip = 1

[build]
script = """
cd "$BUILD"
[ -f Makefile ] || "$SRC/configure" --prefix=/usr --libdir=/usr/lib \\
    --disable-all-programs --enable-libuuid --enable-libblkid \\
    --disable-nls --disable-static --disable-bash-completion --disable-asciidoc --disable-poman \\
    --without-systemd --without-udev --without-python
make -j"$JOBS"
make install DESTDIR="$DEST"
"""
