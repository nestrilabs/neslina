[package]
name = "neslina-setup"
description = "The setup UI's server: HTTPS on the LAN, login, host state, disk assignment, install progress"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
libc.workspace = true
argon2 = { version = "0.5", features = ["std"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "service"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "net", "macros", "time", "sync"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
toml = "0.9"
tower = { version = "0.5", features = ["util"] }
neslina-common.workspace = true
neslina-disks = { path = "../disks" }
