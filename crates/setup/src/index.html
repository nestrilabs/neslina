<!doctype html>
<!-- A working stand-in for the setup UI: every API call, no design yet. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>neslina setup</title>
<style>
  body { font: 15px/1.5 system-ui, sans-serif; max-width: 52rem; margin: 2rem auto; padding: 0 1rem; }
  section { border-top: 1px solid #8884; padding: 1rem 0; }
  table { border-collapse: collapse; width: 100%; }
  td, th { text-align: left; padding: .25rem .5rem; border-bottom: 1px solid #8882; }
  pre { background: #8881; padding: .5rem; overflow-x: auto; max-height: 24rem; }
  .err { color: #c22; }
  [hidden] { display: none; }
</style>
</head>
<body>
<h1>neslina setup</h1>
<p class="err" id="error"></p>

<section id="login" hidden>
  <h2>Log in</h2>
  <p>The first password is in <code>neslina/setup.toml</code> on the USB stick.</p>
  <form id="login-form"><input type="password" name="password" autofocus> <button>Log in</button></form>
</section>

<section id="password" hidden>
  <h2>Set your own password</h2>
  <p>At least 12 characters. It replaces the one on the stick, which is then removed.</p>
  <form id="password-form"><input type="password" name="password" minlength="12"> <button>Save</button></form>
</section>

<section id="host" hidden>
  <h2>This machine</h2>
  <p id="summary"></p>
  <h3>Disks</h3>
  <form id="disks-form">
    <table id="disks"></table>
    <p><label><input type="checkbox" name="wipe"> Erase the chosen disks. Everything on them is lost.</label></p>
    <button>Install</button>
  </form>
  <h3>Install</h3>
  <p id="job"></p>
  <pre id="log"></pre>
</section>

<script>
const $ = (id) => document.getElementById(id);
async function api(path, body) {
  const r = await fetch(path, body === undefined ? {} : {
    method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body),
  });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(data.error || r.statusText), { status: r.status });
  return data;
}
function show(id) {
  for (const s of ["login", "password", "host"]) $(s).hidden = s !== id;
}
const gib = (b) => (b / 2 ** 30).toFixed(0) + " GiB";

async function refresh() {
  let st;
  try { st = await api("/api/state"); } catch (e) { if (e.status === 401) return show("login"); throw e; }
  if (st.must_change_password) return show("password");
  show("host");
  const h = st.host;
  $("summary").textContent = `${h.hostname}: ${h.cpu}, ${h.threads} threads, ${gib(h.memory_bytes)} RAM. ` +
    `Running slot ${h.slot} (${h.version}). State disk: ${h.state_disk ? "set up" : "not yet"}.`;
  $("disks").innerHTML = "<tr><th>Disk</th><th>Size</th><th>Model</th><th>Serial</th><th>State</th><th>Games</th></tr>" +
    h.disks.map((d) => d.holds_medium
      ? `<tr><td>${d.name}</td><td>${gib(d.size)}</td><td colspan="4">holds the boot medium</td></tr>`
      : `<tr><td>${d.name}</td><td>${gib(d.size)}</td><td>${d.model || ""}</td><td>${d.serial || ""}</td>` +
        `<td><input type="radio" name="state" value="${d.name}"></td>` +
        `<td><input type="radio" name="games" value="${d.name}"></td></tr>`).join("");
  const j = st.job;
  $("job").textContent = {
    running: `Running: ${j.step}`,
    failed: `Failed in ${j.step}: ${j.reason}`,
    finished: "Finished without installing anything; the host's log says why (is the install bundle on the stick?).",
  }[j.state] || "Not running.";
  const log = await api("/api/log").catch(() => ({ lines: [] }));
  $("log").textContent = log.lines.join("\n");
}

function form(id, handler) {
  $(id).addEventListener("submit", async (ev) => {
    ev.preventDefault();
    $("error").textContent = "";
    try { await handler(new FormData(ev.target)); await refresh(); } catch (e) { $("error").textContent = e.message; }
  });
}
form("login-form", (f) => api("/api/login", { password: f.get("password") }));
form("password-form", (f) => api("/api/password", { password: f.get("password") }));
form("disks-form", (f) => {
  const wipe = f.get("wipe") === "on";
  const body = { state: { name: f.get("state"), wipe } };
  if (f.get("games")) body.games = { name: f.get("games"), wipe };
  return api("/api/disks", body);
});
refresh().catch((e) => ($("error").textContent = e.message));
setInterval(() => { if (!$("host").hidden) refresh().catch(() => {}); }, 5000);
</script>
</body>
</html>
